<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Slow Calculator Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .controls { margin-bottom: 15px; }
        input, button { padding: 8px 12px; margin-right: 10px; font-size: 14px; }
        #result { font-weight: bold; font-size: 18px; color: #333; margin-top: 15px; }
        #status { margin-top: 5px; color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>Slow Calculator (Test Page)</h1>
    
    <div class="controls">
        <label for="delay">Задержка (сек): </label>
        <!-- Важно: id="delay" -->
        <input type="text" id="delay" value="45">
        <!-- Важно: id="start" -->
        <button id="start">Start</button>
    </div>

    <div id="status">Ожидание...</div>
    <!-- Важно: id="result" -->
    <div id="result">Результат: —</div>

    <script>
        const startBtn = document.getElementById('start');
        const resultDiv = document.getElementById('result');
        const statusDiv = document.getElementById('status');
        const delayInput = document.getElementById('delay');

        startBtn.addEventListener('click', () => {
            const delaySeconds = parseInt(delayInput.value) || 45;
            statusDiv.textContent = `Выполняется задержка ${delaySeconds} сек...`;
            resultDiv.textContent = 'Результат: —';

            // Имитация «медленного» калькулятора: ждём ровно столько секунд, сколько ввели
            setTimeout(() => {
                const fakeResult = delaySeconds * 2; // простая логика: результат = задержка * 2
                resultDiv.textContent = `Результат: ${fakeResult}`;
                statusDiv.textContent = 'Готово!';
            }, delaySeconds * 1000);
        });
    </script>
</body>
</html>
