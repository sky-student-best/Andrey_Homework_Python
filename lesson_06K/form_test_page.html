<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Form Page</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 300px; border: 1px solid #ccc; }
        /* Стили для валидации */
        .is-valid { border-color: green; }
        .is-invalid { border-color: red; }
    </style>
</head>
<body>
    <h1>Форма для автотеста</h1>
    <form id="testForm">
        <div class="form-group">
            <label>First name</label>
            <input type="text" name="firstName" id="firstName">
        </div>
        <div class="form-group">
            <label>Last name</label>
            <input type="text" name="lastName" id="lastName">
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" id="address">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" id="email">
        </div>
        <div class="form-group">
            <label>Phone number</label>
            <input type="tel" name="phone" id="phone">
        </div>
        <div class="form-group">
            <label>Zip code</label>
            <input type="text" name="zipCode" id="zipCode">
        </div>
        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" id="city">
        </div>
        <div class="form-group">
            <label>Country</label>
            <input type="text" name="country" id="country">
        </div>
        <div class="form-group">
            <label>Job position</label>
            <input type="text" name="jobPosition" id="jobPosition">
        </div>
        <div class="form-group">
            <label>Company</label>
            <input type="text" name="company" id="company">
        </div>
        <button type="submit" id="submitBtn">Submit</button>
    </form>

    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const zipCode = document.getElementById('zipCode');
            const otherFields = [
                document.getElementById('firstName'),
                document.getElementById('lastName'),
                document.getElementById('address'),
                document.getElementById('email'),
                document.getElementById('phone'),
                document.getElementById('city'),
                document.getElementById('country'),
                document.getElementById('jobPosition'),
                document.getElementById('company')
            ];

            // Логика валидации из задания: Zip code пустой -> красный, остальные заполнены -> зелёные
            if (zipCode.value.trim() === '') {
                zipCode.classList.add('is-invalid');
                zipCode.classList.remove('is-valid');
            } else {
                zipCode.classList.add('is-valid');
                zipCode.classList.remove('is-invalid');
            }

            otherFields.forEach(field => {
                if (field.value.trim() !== '') {
                    field.classList.add('is-valid');
                    field.classList.remove('is-invalid');
                }
            });
        });
    </script>
</body>
</html>
